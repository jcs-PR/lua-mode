name: Test

on: push

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        emacs-version:
          - '26.3'
          - '27.2'
          - '28.2'
          - '29.4'
          - '30.2'
        include:
          # - emacs_version: 'snapshot'
          #   os: ubuntu-latest
          #   allow_failure: true
          # - os: macos-latest
          #   emacs_version: '24.3'
          - os: macos-latest
            emacs_version: '25.1'
          - os: macos-latest
            emacs_version: '27.1'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Emacs
        uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Set up Eask
        uses: emacs-eask/setup-eask@master
        with:
          version: 'snapshot'

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Lua
        uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "5.2.4"

      - name: Run tests
        if: matrix.allow_failure != true
        run: 'eask && make test'

      - name: Run tests (allow failure)
        if: matrix.allow_failure == true
        run: 'eask && make test || true'
